<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - IT Helpdesk RAG</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='3') }}">
  <style>
    /* Immediate browser override: disable Edge/IE native password reveal button */
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear,
    input::-ms-reveal,
    input::-ms-clear {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      pointer-events: none;
    }
  </style>
  <script>
    // Tab-Session Verification & Multi-Tab Synchronization
    (function() {
      // 1. Sync remote logout across all tabs
      if (typeof BroadcastChannel !== 'undefined') {
        try {
          var bc = new BroadcastChannel('helpdesk_auth_sync');
          bc.onmessage = function(ev) {
            if (ev.data && ev.data.type === 'LOGOUT') {
              sessionStorage.removeItem('tab_session_id');
            }
          };
        } catch(e) {}
      }
      window.addEventListener('storage', function(e) {
        if (e.key === 'helpdesk_global_logout_time') {
          sessionStorage.removeItem('tab_session_id');
        }
      });

      // 2. Check if THIS specific tab already has an active tab-level session
      var tabSession = sessionStorage.getItem('tab_session_id');
      var isServerAuth = {% if current_user.is_authenticated %}true{% else %}false{% endif %};
      var isAdmin = {% if current_user.is_authenticated and current_user.is_admin %}true{% else %}false{% endif %};

      // Only if THIS tab was already authenticated in this session, resume to dashboard.
      // When opened in a NEW tab, sessionStorage is empty -> stay on landing/login page!
      if (tabSession && isServerAuth) {
        window.location.replace(isAdmin ? "{{ url_for('admin.dashboard') }}" : "{{ url_for('auth.dashboard') }}");
      } else {
        sessionStorage.removeItem('tab_session_id');
      }
    })();
  </script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon">
          <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="IT Helpdesk Logo">
        </div>
        <h1>IT Helpdesk Portal</h1>
        <p>Sign in to access IT support and AI RAG knowledge base</p>
      </div>

      <!-- Flash Messages -->
      <div class="alerts-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">
                <span>{{ message }}</span>
                <button type="button" class="alert-close" aria-label="Close">&times;</button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
      </div>

      <!-- Login Form -->
      <form action="{{ url_for('auth.login') }}" method="POST">
        <div class="form-group">
          <label class="form-label" for="identifier">Username or Email</label>
          <input 
            type="text" 
            id="identifier" 
            name="identifier" 
            class="form-input" 
            placeholder="e.g. employee@company.com or john_doe" 
            value="{{ identifier or '' }}" 
            required 
            autofocus
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Enter your password" 
              required
            >
            <button type="button" class="toggle-password" data-target="password" aria-label="Toggle password visibility" title="Show / Hide password">
              <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-icon eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" name="remember" id="remember" value="1">
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="{{ url_for('auth.register') }}">Create an account</a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var loginForm = document.querySelector('form');
      if (loginForm) {
        loginForm.addEventListener('submit', function() {
          // Set active tab-session ID for THIS tab upon login
          var tabToken = 'tab_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
          sessionStorage.setItem('tab_session_id', tabToken);
        });
      }
    });
  </script>
</body>
</html>
